# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit reviews code only. Class notes, precept passes, transcripts,
# study pages and other content record what the classes taught, in their own
# words (see AGENTS.md); they are not reviewed for wording, facts or reasoning.
language: en-US
reviews:
  profile: chill
  path_filters:
    - "!blog/**"
    - "!captains/**"
    - "!history/**"
    - "!data/**"
    - "!docs/**"
    - "!changes/**"
    - "!brand/**"
    - "!dashboard/**/*.json"
    - "!**/*.md"
    - "!**/*.tsv"
    - "!**/*.txt"
  path_instructions:
    - path: "**/*"
      instructions: |
        Review only the code: bugs, security, performance, accessibility and
        maintainability. Do not comment on the teaching, wording, history,
        dates, names or reasoning in any text the code carries, quotes or
        builds (class notes, precepts, readings, prompts, UI copy taken from
        the classes), and do not suggest editorial notes, corrections or
        softer language.
