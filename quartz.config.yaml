# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: CyberJudah Study Bible
  pageTitleSuffix: " · CyberJudah"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: null
  locale: en-US
  baseUrl: devsecobie.github.io/cyberjudah
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - "**/_tools/**"
    - "**/_pdf/**"
    - "**/*.pdf"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Newsreader
      body: Newsreader
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#faf9f7"
        lightgray: "#e8e5df"
        gray: "#8a8478"
        darkgray: "#403c35"
        dark: "#1c1915"
        secondary: "#8a6a33"
        tertiary: "#6b5d48"
        highlight: rgba(138, 106, 51, 0.09)
        textHighlight: "#e9d9ae66"
      darkMode:
        light: "#12100d"
        lightgray: "#282520"
        gray: "#948c7e"
        darkgray: "#d6d1c7"
        dark: "#f1ede5"
        secondary: "#c9a35c"
        tertiary: "#a89880"
        highlight: rgba(201, 163, 92, 0.10)
        textHighlight: "#c9a35c44"
plugins:
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties: []
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority: [frontmatter, git, filesystem]
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme: { light: github-light, dark: github-dark }
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: false
    order: 50
    layout: { position: right, priority: 30 }
  - source: "@quartz-community/crawl-links"
    enabled: true
    options: { markdownLinkResolution: shortest }
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options: { enableSiteMap: true, enableRSS: true }
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: false
    layout: { position: left, priority: 50 }
  - source: "@quartz-community/graph"
    enabled: false
    layout: { position: right, priority: 10 }
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions: { grow: true }
  - source: "@quartz-community/backlinks"
    enabled: false
    layout: { position: right, priority: 50 }
  - source: "@quartz-community/article-title"
    enabled: true
    layout: { position: beforeBody, priority: 10 }
  - source: "@quartz-community/content-meta"
    enabled: true
    layout: { position: beforeBody, priority: 20 }
  - source: "@quartz-community/page-title"
    enabled: true
    layout: { position: left, priority: 10 }
  - source: "@quartz-community/darkmode"
    enabled: true
    layout: { position: left, priority: 30, group: toolbar }
  - source: "@quartz-community/reader-mode"
    enabled: false
    layout: { position: left, priority: 35, group: toolbar }
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout: { position: beforeBody, priority: 5 }
  - source: "@quartz-community/footer"
    enabled: false
    options:
      links: {}
    layout: { position: footer, priority: 50 }
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout: { position: left, priority: 25, display: mobile-only }
layout:
  groups:
    toolbar: { priority: 35, direction: row, gap: 0.5rem }
  byPageType:
    "404":
      positions: { beforeBody: [], left: [], right: [] }
    content: {}
    folder:
      exclude: [reader-mode]
      positions: { right: [] }
    tag:
      exclude: [reader-mode]
      positions: { right: [] }
