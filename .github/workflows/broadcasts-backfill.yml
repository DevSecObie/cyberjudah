name: Backfill class broadcast starts

# Records YouTube's broadcast start (liveBroadcastDetails.startTimestamp) for dated classes
# that have none in data/sources/class-broadcasts.json, so a day's classes sort in broadcast
# order. The hourly harvest only tries 20 a run, from the last 60 days, and YouTube refuses
# plain page fetches from GitHub's runners; this run uses yt-dlp with the same
# YOUTUBE_COOKIES secret the audio fallback uses. Every class it cannot record is logged
# with the reason, and the run fails when YouTube refused every lookup.
on:
  workflow_dispatch:
    inputs:
      since:
        description: Only classes dated on or after this day (YYYY-MM-DD)
        default: "2013-01-01"
        required: true
      tries:
        description: Classes to look up this run
        default: "1000"
        required: true

permissions:
  contents: write

concurrency:
  # Shares the harvest's group so the two never push class-broadcasts.json at the same time.
  group: transcript-harvest
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 1
          ref: main
          persist-credentials: false

      - run: python3 -m pip install "yt-dlp[default]==2026.10.26"

      - name: Look up missing broadcast starts
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          SINCE: ${{ inputs.since }}
          TRIES: ${{ inputs.tries }}
        run: |
          [[ "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "since must be YYYY-MM-DD"; exit 1; }
          [[ "$TRIES" =~ ^[0-9]+$ ]] || { echo "tries must be a number"; exit 1; }
          if [[ -n "$YOUTUBE_COOKIES" ]]; then
            printf '%s' "$YOUTUBE_COOKIES" > /tmp/youtube-cookies.txt
            chmod 600 /tmp/youtube-cookies.txt
            export BROADCASTS_COOKIES=/tmp/youtube-cookies.txt
          fi
          status=0
          python3 scripts/history/broadcasts.py --since "$SINCE" --tries "$TRIES" --fail-if-none \
            | tee /tmp/broadcasts.log || status=$?
          rm -f /tmp/youtube-cookies.txt
          { echo '```'; grep -A40 '^broadcast starts:' /tmp/broadcasts.log || true; tail -1 /tmp/broadcasts.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Commit
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$(git status --porcelain -- data/sources/class-broadcasts.json)" ]]; then
            echo "No broadcast starts recorded."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/sources/class-broadcasts.json
          git commit -m "data: backfill class broadcast starts [skip ci]"
          for attempt in 1 2 3; do
            if git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then
              exit 0
            fi
            git pull --rebase "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
            sleep $((attempt * 2))
          done
          echo "Push failed after 3 attempts."
          exit 1
