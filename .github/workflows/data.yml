name: Publish the data set
# The content engine (engine/) turns the vault into a framework-independent data set and
# publishes it to the `data` branch: one commit, history discarded, about a minute end to
# end. Front ends read it from there (jsDelivr today, Cloudflare later). The Docusaurus site
# has its own workflow (deploy.yml) and is untouched by this one.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "blog/**"
      - "captains/**"
      - "data/**"
      - "engine/**"
      - ".github/workflows/data.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the study-notes feed dates each entry from the commit that added it.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci --prefix engine --no-audit --no-fund
      - run: npm run notes:lint
      # The link checker gates the publish: every scripture link and cross reference in the
      # notes must resolve, the job the Docusaurus build used to do.
      - run: node engine/check.mjs
      - name: Build the data set
        run: node engine/build.mjs --out dist --site https://cyberjudah.io
      - name: Publish to the data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git checkout -q -b data
          git add -A
          git -c user.name="content engine" -c user.email="engine@cyberjudah.io" commit -qm "data set from ${GITHUB_SHA::12} at $(date -u +%FT%TZ)"
          # The pointer names the commit that holds the data set, so a CDN can serve that
          # commit content-addressed (immutable, cached forever) while the pointer itself
          # stays tiny and short-lived. It has to be a second commit: a commit cannot
          # contain its own hash.
          DATA_SHA=$(git rev-parse HEAD)
          printf '{"commit":"%s","source":"%s","built":"%s"}\n' "$DATA_SHA" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > pointer.json
          git add pointer.json
          git -c user.name="content engine" -c user.email="engine@cyberjudah.io" commit -qm "pointer -> $DATA_SHA"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "data set: $DATA_SHA"
      - name: Serve it at data.cyberjudah.io
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -rf dist/.git
          npx --yes wrangler@4 deploy --config engine/worker/wrangler.jsonc
      - name: Load the search index into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          .github/scripts/d1-id.sh cyberjudah > /dev/null
          gunzip -kf dist/search.sql.gz
          npx --yes wrangler@4 d1 execute cyberjudah --remote --file dist/search.sql -y | tail -3
