name: Publish the data set
# The content engine (engine/) turns the vault into a framework-independent data set and
# publishes it to the R2 bucket cyberjudah-data, which the Worker at data.cyberjudah.io serves.
# Each build uploads only the files that changed, then goes live in one write of pointer.json
# (engine/publish.mjs). Git holds the source only; the built files are not committed anywhere.
# The site has its own workflow (site.yml) and is untouched by this one.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "blog/**"
      - "captains/**"
      - "data/**"
      - "history/**"
      - "engine/**"
      - ".github/workflows/data.yml"
      - "!**/transcripts/**"
      - "!**/no-captions.tsv"
      - "!**/channel-meta.tsv"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: data
  cancel-in-progress: true
jobs:
  publish:
    # CMS publication merges reviewed source; live data still requires owner approval.
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the study-notes feed dates each entry from the commit that added it.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci --prefix engine --no-audit --no-fund
      # The lint reports; it does not gate the publish. A name spelled two ways in one note
      # edited from the app must never hold every other note back; the quality workflow flags it.
      - run: npm run notes:lint
        continue-on-error: true
      # The link checker gates the publish: every scripture link and cross reference in the
      # notes must resolve, the job the Docusaurus build used to do.
      # Case-study drafts are validated by the quality workflow. Do not let that separate
      # backlog block publication of otherwise-valid notes and their scripture links.
      - name: Check the library, including every person a batch added or edited for two-way family links
        env:
          PEOPLE_BASE: ${{ github.event.before }}
        run: node engine/check.mjs --allow-case-errors
      - name: Build the data set
        run: node engine/build.mjs --out dist --site https://cyberjudah.io
      # Bucket-scoped R2 keys (Object Read & Write on cyberjudah-data only), not the account token.
      - name: Upload what changed to R2 and make this build live
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_DATA_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_DATA_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET_NAME: cyberjudah-data
        run: node engine/publish.mjs --dir dist --source "$GITHUB_SHA"
      - name: Deploy the data.cyberjudah.io Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config engine/worker/wrangler.jsonc
      - name: Load the search index into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          .github/scripts/d1-id.sh cyberjudah > /dev/null
          gunzip -kf dist/search.sql.gz
          npx --yes wrangler@4 d1 execute cyberjudah --remote --file dist/search.sql -y 2>&1 | tail -5; test ${PIPESTATUS[0]} -eq 0
