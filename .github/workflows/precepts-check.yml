name: Check precept passes

# Every pull request that adds or changes a class precept pass (data/precepts/classes/*.json,
# see AGENTS.md) is checked before review: real references, verses inside their passages,
# timestamps in order, and every quote word for word from the King James text. The build
# then proves the pass loads into the Bible data.
on:
  pull_request:
    paths:
      - "data/precepts/classes/**"
      - "scripts/precepts/classes.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Only precept passes in this pull request
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          other=$(git diff --name-only "origin/${{ github.base_ref }}" HEAD | grep -v '^data/precepts/classes/' | grep -v '^scripts/precepts/classes.py$' || true)
          if [ -n "$other" ]; then echo "::error::A precept pass adds only data/precepts/classes/<video id>.json. Also changed:"; echo "$other"; exit 1; fi
      - name: Check the passes
        run: |
          set -o pipefail
          files=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}" HEAD -- 'data/precepts/classes/*.json')
          python3 scripts/precepts/classes.py check $files | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the Bible data with them
        run: |
          set -o pipefail
          npm ci --prefix engine --no-audit --no-fund
          npm run build 2>&1 | tee build.log | tail -3
          grep -E "precept passes|engine:" build.log >> "$GITHUB_STEP_SUMMARY" || true
