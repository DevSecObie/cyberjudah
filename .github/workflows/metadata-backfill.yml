name: Backfill transcript metadata

# Fills blank upload dates, lengths and views in each feed's channel-meta.tsv, and blank
# lengths in transcript files, from the YouTube Data API (YOUTUBE_API_KEY, free quota).
# Existing values are never overwritten. Run on demand.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Videos to look up this run
        default: "1000"
        required: true

permissions:
  contents: write

concurrency:
  # Shares the harvest's group so the two never push channel-meta.tsv at the same time.
  group: transcript-harvest
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          ref: main

      - name: Look up missing metadata
        env:
          LIMIT: ${{ inputs.limit }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 scripts/corpus/backfill_meta.py --report --lengths
          python3 scripts/corpus/backfill_meta.py --backend youtube --lengths --limit "$LIMIT"
          python3 scripts/corpus/backfill_meta.py --report --lengths | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$(git status --porcelain -- '*/channel-meta.tsv' '*/transcripts/*.json')" ]]; then
            echo "No metadata found."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*/channel-meta.tsv' '*/transcripts/*.json'
          git commit -m "metadata: backfill dates and lengths [skip ci]"
          for attempt in 1 2 3; do
            if git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then
              exit 0
            fi
            git pull --rebase "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
            sleep $((attempt * 2))
          done
          echo "Push failed after 3 attempts."
          exit 1
