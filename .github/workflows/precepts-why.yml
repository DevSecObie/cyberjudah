name: Write precept breakdowns

# The "Precept(s)" breakdowns in the Bible app: for each precept a class note lined up with a
# scripture, a line or two on why it is there, written from the class by Claude through the
# Message Batches API (scripts/precepts/why.py). Only precepts without a breakdown are sent,
# so a run after new notes costs only what is new. Needs the ANTHROPIC_API_KEY secret.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: At most this many passages (0 for every missing one)
        default: "0"

permissions:
  contents: write

concurrency:
  group: precepts-why
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 -m pip install --upgrade anthropic

      - name: Write the breakdowns
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          python3 scripts/precepts/why.py --plan --limit "$LIMIT" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/precepts/why.py --limit "$LIMIT" --show --timeout 9000 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/precepts/why.json
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "precepts: breakdowns for $(python3 -c 'import json;print(len(json.load(open("data/precepts/why.json"))))') precepts"
          for attempt in 1 2 3; do
            if git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then exit 0; fi
            git pull --rebase "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
            sleep $((attempt * 3))
          done
          exit 1
