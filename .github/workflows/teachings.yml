name: Build teaching search index
on:
  # Daily, so the classes harvested each hour reach the teachings search and the chapters'
  # "Taught" lists without anyone starting it (it went unrun for weeks when it was manual only).
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: teaching-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    environment: automation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - run: python3 scripts/corpus/build.py
      - run: python3 scripts/corpus/index.py
      - run: npm ci --prefix site --no-audit --no-fund
      # Blue-green: a spare copy is loaded and checked beside the live tables, then switched in
      # one step, so /teachings and the bot's teachings never pause and a bad load never goes live.
      - name: Load teaching passages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/load-search-d1.mjs dist/teachings.sql cyberjudah teachings
