name: Build teaching search index
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: teaching-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    environment: automation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - run: python3 scripts/corpus/build.py
      - run: python3 scripts/corpus/index.py
      - run: npm ci --prefix site --no-audit --no-fund
      - name: Load teaching passages
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute cyberjudah --remote --file ../dist/teachings.sql -y
