name: Build teaching search index
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: teaching-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/corpus/build.py
      - run: python3 scripts/corpus/index.py
      - run: npm ci --prefix site --no-audit --no-fund
      - name: Load teaching passages
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute cyberjudah --remote --file ../dist/teachings.sql -y
