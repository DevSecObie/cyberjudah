name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the study-notes feed dates each entry from the commit that added the
          # note. At the default depth of 1 there is no per-file history to read and every
          # entry would carry the build time instead.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The note linter gates the deploy: a malformed note is a content bug the build
      # itself will not catch, since Docusaurus only checks links.
      - run: npm run notes:lint
      - run: npm test
      - run: npm run build:profile
        env:
          DOCUSAURUS_SSR_CONCURRENCY: 1
          # SSR concurrency applies per worker, not to the whole worker pool.
          DOCUSAURUS_SSG_WORKER_THREAD_COUNT: 1
          NODE_OPTIONS: --max-old-space-size=3500
      - run: npm run typecheck
      - run: npm run build:verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-profile
          path: build-profile
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
