name: Hourly Transcript Harvest

on:
  schedule:
    # GitHub's top-of-hour queue is heavily congested and can delay or drop runs.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transcript-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Install channel inventory tool
        run: python3 -m pip install --upgrade yt-dlp

      - name: Run TranscriptAPI harvest
        env:
          TRANSCRIPTAPI_KEY: ${{ secrets.TRANSCRIPTAPI_KEY }}
          GJT: ${{ secrets.GJT }}
          HARVEST_RAW_DIR: /tmp/transcriptapi-harvest-raw
        run: |
          if [[ ! -f dashboard/completed-sources/iuicintheclassroom2.json ]]; then
            python3 scripts/history/harvest.py --feed classes --channel iuicintheclassroom2 --backend transcriptapi --listing-backend yt-dlp --limit 200 --push --recheck-nocaption-days -1 --completion-marker dashboard/completed-sources/iuicintheclassroom2.json
          fi
          if [[ ! -f dashboard/completed-sources/yabanisrael7530.json ]]; then
            python3 scripts/history/harvest.py --feed classes --channel yabanisrael7530 --backend transcriptapi --listing-backend yt-dlp --limit 200 --push --recheck-nocaption-days -1 --completion-marker dashboard/completed-sources/yabanisrael7530.json
          fi
          if [[ ! -f dashboard/completed-sources/IUICRaleigh.json ]]; then
            python3 scripts/history/harvest.py --feed classes --channel IUICRaleigh --backend transcriptapi --listing-backend yt-dlp --tabs videos,streams,shorts --limit 200 --push --recheck-nocaption-days -1 --completion-marker dashboard/completed-sources/IUICRaleigh.json
          fi

      - name: Update transcript backlog dashboard
        env:
          TRANSCRIPTAPI_KEY: ${{ secrets.TRANSCRIPTAPI_KEY }}
        run: |
          mkdir -p dashboard
          python3 scripts/history/dashboard.py --json dashboard/transcript-backlog.json --markdown /tmp/transcript-backlog.md --html /tmp/transcript-backlog.html
          cat /tmp/transcript-backlog.md >> "$GITHUB_STEP_SUMMARY"
          cp /tmp/transcript-backlog.md dashboard/transcript-backlog.md
          cp /tmp/transcript-backlog.html dashboard/transcript-backlog.html

      - name: Commit updated dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$(git status --porcelain dashboard/transcript-backlog.md dashboard/transcript-backlog.json dashboard/transcript-backlog.html dashboard/completed-sources)" ]]; then
            echo "No dashboard changes."
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/transcript-backlog.md dashboard/transcript-backlog.json dashboard/transcript-backlog.html dashboard/completed-sources
          git commit -m "chore: refresh transcript backlog dashboard [skip ci]"

          for attempt in 1 2 3; do
            if git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}; then
              exit 0
            fi
            git pull --rebase "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_REF_NAME}"
            sleep $((attempt * 2))
          done

          echo "Dashboard push failed after 3 attempts."
          exit 1
