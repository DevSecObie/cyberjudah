name: Hourly Transcript Harvest

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transcript-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run TranscriptAPI harvest
        env:
          TRANSCRIPTAPI_KEY: ${{ secrets.TRANSCRIPTAPI_KEY }}
          GJT: ${{ secrets.GJT }}
          HARVEST_RAW_DIR: /tmp/transcriptapi-harvest-raw
        run: |
          python3 scripts/history/harvest.py --feed captains --channel iuiccaptains6939 --backend transcriptapi --limit 200 --push
          python3 scripts/history/harvest.py --feed history --channel ourhiddenhistoryradio1991 --backend transcriptapi --limit 200 --push
          python3 scripts/history/harvest.py --feed classes --channel IUICintheClassRoom --backend transcriptapi --limit 200 --push
          python3 scripts/history/harvest.py --feed classes --channel iuicintheclassroom2 --backend transcriptapi --limit 200 --push

      - name: Update transcript backlog dashboard
        env:
          TRANSCRIPTAPI_KEY: ${{ secrets.TRANSCRIPTAPI_KEY }}
        run: |
          mkdir -p dashboard
          python3 scripts/history/dashboard.py --json dashboard/transcript-backlog.json --markdown /tmp/transcript-backlog.md
          cat /tmp/transcript-backlog.md >> "$GITHUB_STEP_SUMMARY"
          cp /tmp/transcript-backlog.md dashboard/transcript-backlog.md

      - name: Commit updated dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$(git status --porcelain dashboard/transcript-backlog.md dashboard/transcript-backlog.json)" ]]; then
            echo "No dashboard changes."
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/transcript-backlog.md dashboard/transcript-backlog.json
          git commit -m "chore: refresh transcript backlog dashboard [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
          echo
