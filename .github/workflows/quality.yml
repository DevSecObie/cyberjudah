name: Validate proposed changes
on: pull_request
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site --no-audit --no-fund
      - run: npm run corpus:test
      - run: npm run history:test
      - run: python3 scripts/corpus/build.py --limit 10 --skip-scriptures --strict --out /tmp/cyberjudah-corpus-smoke
      - name: Check the library, including every person a batch added or edited for two-way family links
        env:
          PEOPLE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node engine/check.mjs
      - run: node --test engine/strongs-pages.test.mjs engine/class-metadata.test.mjs engine/people-validation.test.mjs engine/people-reciprocity.test.mjs engine/people-evidence.test.mjs
      - run: npm test --prefix site
      - run: npm run build --prefix site
      - run: npx --prefix site playwright install --with-deps chromium
      - run: npm run test:e2e --prefix site
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: |
            site/playwright-report
            site/test-results
          retention-days: 7
