name: Validate proposed changes
on: pull_request
permissions:
  contents: read
jobs:
  data-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            engine/package-lock.json
            site/package-lock.json
      - run: npm ci --prefix engine --no-audit --no-fund
      - run: npm ci --prefix site --no-audit --no-fund
      - name: Build, publish to an in-memory bucket and serve through the data Worker, without deploying
        run: node --test engine/data-assets.test.mjs
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site --no-audit --no-fund
      - name: Reject vulnerable website runtime dependencies
        run: npm audit --prefix site --omit=dev --audit-level=high
      - run: npm run corpus:test
      - run: npm run history:test
      - run: python3 scripts/corpus/build.py --limit 10 --skip-scriptures --strict --out /tmp/cyberjudah-corpus-smoke
      - name: Check the library, including every person a batch added or edited for two-way family links
        env:
          PEOPLE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node engine/check.mjs
      - run: node --test engine/publish.test.mjs engine/strongs-pages.test.mjs engine/class-metadata.test.mjs engine/people-kjv.test.mjs
      - run: python3 -m unittest discover -s scripts/audio -p 'test_*.py'
      - run: python3 scripts/audio/recordings.py check
      - run: npm test --prefix site
      - run: npm run build --prefix site
      - run: npx --prefix site playwright install --with-deps chromium
      - run: npm run test:e2e --prefix site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: browser-test-failures
          path: |
            site/playwright-report
            site/test-results
          retention-days: 7
