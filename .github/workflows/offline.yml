name: Offline library

# Builds the offline library (scripts/offline/build.py): the KJV with the Apocrypha and every class's
# study notes as plain web pages, plain text, and one Kiwix file. Each build replaces the files on the
# "offline-latest" release, so the newest library is always at one link.
on:
  push:
    branches: [main]
    paths:
      - "data/precepts/classes/**"
      - "data/bible/**"
      - "data/glossary.json"
      - "scripts/offline/**"
      - "scripts/precepts/classes.py"
      - ".github/workflows/offline.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offline-library
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install libzim==3.13.1
      - run: python3 scripts/offline/build.py dist/offline
      - name: Package
        run: |
          cd dist/offline
          zip -qr cyberjudah-offline-html.zip html
          zip -qr cyberjudah-offline-text.zip text
          ls -la
      - name: Publish to the offline-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view offline-latest >/dev/null 2>&1 || gh release create offline-latest --title "Offline library (latest)" --notes "The KJV with the Apocrypha and the class study notes, for devices with no internet. Kiwix: cyberjudah.zim. Any browser: cyberjudah-offline-html.zip (open html/index.html). Smallest devices: cyberjudah-offline-text.zip. Rebuilt whenever notes merge. Setup: scripts/offline/README.md."
          gh release upload offline-latest dist/offline/cyberjudah.zim dist/offline/cyberjudah-offline-html.zip dist/offline/cyberjudah-offline-text.zip --clobber
