name: Deploy the site
# Builds site/ (TanStack Start) and ships the Worker to Cloudflare at cyberjudah.io.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "engine/validation.mjs"
      - ".github/workflows/site.yml"
      - ".github/scripts/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: automation
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          # The Telegram Mini App's t.me link (repository variable), so shared pages open in Telegram.
          VITE_TELEGRAM_APP_URL: ${{ vars.TELEGRAM_APP_URL }}
      # Case-study drafts are held to the strict gate in the quality workflow. Keep that
      # separate backlog visible without blocking deployment of valid site and note work.
      - run: npm test
        env:
          ALLOW_CASE_ERRORS: "1"
      - run: node ../engine/check.mjs --allow-case-errors
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: failure()
        with:
          name: browser-test-failures
          path: |
            site/playwright-report
            site/test-results
          retention-days: 7
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The D1 id is account-specific, so it is looked up (or the database created) here
          # rather than committed.
          ID=$(../.github/scripts/d1-id.sh cyberjudah)
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.jsonc
          npx wrangler deploy
