name: Deploy the site
# Builds site/ (TanStack Start) and ships the Worker to Cloudflare at cyberjudah.io.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
      - ".github/scripts/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The D1 id is account-specific, so it is looked up (or the database created) here
          # rather than committed.
          ID=$(../.github/scripts/d1-id.sh cyberjudah)
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.jsonc
          npx wrangler deploy
